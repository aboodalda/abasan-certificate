<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وثيقة الوفاء لبلدة عبسان الجديدة</title>

<style>
body{
font-family:Tahoma,sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
text-align:center;
}

header{
background:#0b6b3a;
color:white;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input{
width:90%;
padding:12px;
font-size:18px;
margin:10px 0;
}

button{
background:#0b6b3a;
color:white;
border:none;
padding:12px 25px;
font-size:18px;
cursor:pointer;
border-radius:8px;
}

canvas{
margin-top:20px;
max-width:100%;
background:white;
border:2px solid #0b6b3a;
}

.stats{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:20px;
flex-wrap:wrap;
}

.stat{
background:#f2f2f2;
padding:15px;
border-radius:10px;
}

#people{
margin-top:30px;
text-align:right;
}

.person{
background:white;
padding:10px;
margin:8px 0;
border-radius:8px;
}
</style>

</head>

<body>

<header>
<h1>وثيقة الوفاء لبلدة عبسان الجديدة</h1>
<p>سجل اسمك وأصدر وثيقتك الرقمية</p>
</header>

<div class="container">

<div class="stats">
<div class="stat">📜 الشهادات: <span id="count">0</span></div>
</div>

<div class="card">

<input id="name" placeholder="اكتب اسمك الكامل">

<button onclick="generateCertificate()">
إصدار الوثيقة
</button>

<br><br>

<canvas id="canvas" width="1200" height="1200"></canvas>

<br><br>

<button onclick="downloadImage()">
تحميل الوثيقة
</button>
<button onclick="shareCertificate()">
📲 شارك الوثيقة
</button>
</div>

<div id="people"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
query,
orderBy,
limit,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
const firebaseConfig = {
apiKey: "AIzaSyCdPq65Vz8tTn76k-XWwdK50ARyvDTLNbg",
authDomain: "abasan-certificate.firebaseapp.com",
projectId: "abasan-certificate",
storageBucket: "abasan-certificate.firebasestorage.app",
messagingSenderId: "156602443374",
appId: "1:156602443374:web:cb8369c7cf4b40c207a87f",
measurementId: "G-9SFYX4SCNC"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.generateCertificate = async function(){

const name=document.getElementById("name").value.trim();

if(!name){
alert("اكتب الاسم");
return;
}

const snapshot=await getDocs(collection(db,"certificates"));

const number=snapshot.size+1;

await addDoc(collection(db,"certificates"),{
name:name,
number:number,
createdAt:serverTimestamp()
});

document.getElementById("count").textContent=number;

drawCertificate(name,number);

loadPeople();
};

function drawCertificate(name,number){

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

// تنظيف
ctx.clearRect(0,0,1200,1200);

// خلفية فاتحة
ctx.fillStyle="#FDFBF5";
ctx.fillRect(0,0,1200,1200);

// إطار فلسطين
ctx.strokeStyle="#000";
ctx.lineWidth=12;
ctx.strokeRect(20,20,1160,1160);

ctx.strokeStyle="#FFFFFF";
ctx.lineWidth=8;
ctx.strokeRect(40,40,1120,1120);

ctx.strokeStyle="#0B6B3A";
ctx.lineWidth=8;
ctx.strokeRect(60,60,1080,1080);

ctx.strokeStyle="#D32020";
ctx.lineWidth=6;
ctx.strokeRect(80,80,1040,1040);

ctx.textAlign="center";

// شعار عبسان
const logo = new Image();
logo.crossOrigin="anonymous";

logo.onload = function(){

ctx.drawImage(
logo,
500,
80,
200,
200
);

// فلسطين
ctx.fillStyle="#0B6B3A";
ctx.font="bold 42px Arial";
ctx.fillText("دولة فلسطين",600,340);

ctx.fillStyle="#000";
ctx.font="bold 34px Arial";
ctx.fillText("محافظة خان يونس",600,390);

// العنوان
ctx.font="bold 80px Arial";

ctx.fillStyle="#000";
ctx.fillText("وثيقة",250,520);

ctx.fillStyle="#D32020";
ctx.fillText("الوفاء",520,520);

ctx.fillStyle="#0B6B3A";
ctx.fillText("لبلدة عبسان الجديدة",860,520);

// الاسم
ctx.fillStyle="#000";
ctx.font="bold 90px Arial";
ctx.fillText(name,600,660);

// الوصف
ctx.font="40px Arial";
ctx.fillText(
"تُمنح هذه الوثيقة اعتزازاً بانتمائه ووفائه لبلدة عبسان الجديدة",
600,
740
);

// رقم الوثيقة
ctx.strokeStyle="#0B6B3A";
ctx.lineWidth=4;

ctx.strokeRect(
360,
810,
480,
90
);

ctx.fillStyle="#0B6B3A";
ctx.font="bold 50px Arial";

ctx.fillText(
"ABASAN-2026-"+String(number).padStart(6,"0"),
600,
870
);

// QR
const qrUrl =
"https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=" +
encodeURIComponent(
"https://aboodalda.github.io/abasan-certificate/?id="+number
);

const qrImage = new Image();
qrImage.crossOrigin="anonymous";

qrImage.onload = function(){

ctx.drawImage(
qrImage,
90,
820,
110,
110
);

ctx.fillStyle="#555";
ctx.font="20px Arial";
ctx.fillText(
"تحقق من الوثيقة",
145,
970
);

};

qrImage.src = qrUrl;

// الختم
ctx.beginPath();
ctx.arc(980,870,95,0,Math.PI*2);

ctx.strokeStyle="#D32020";
ctx.lineWidth=7;
ctx.stroke();

ctx.beginPath();
ctx.arc(980,870,80,0,Math.PI*2);

ctx.strokeStyle="#0B6B3A";
ctx.lineWidth=4;
ctx.stroke();

ctx.fillStyle="#000";
ctx.font="bold 22px Arial";
ctx.fillText("ختم رسمي",980,855);

ctx.fillStyle="#0B6B3A";
ctx.fillText("عبسان الجديدة",980,895);

// خط سفلي
ctx.strokeStyle="#0B6B3A";
ctx.lineWidth=2;

ctx.beginPath();
ctx.moveTo(320,1030);
ctx.lineTo(880,1030);
ctx.stroke();

// تواقيع
ctx.fillStyle="#000";
ctx.font="bold 32px Arial";

ctx.fillText(
"لجنة أبناء عبسان الجديدة",
240,
1080
);

ctx.fillText(
"وثيقة الوفاء",
960,
1080
);

// شعار صغير بالأسفل
ctx.fillStyle="#0B6B3A";
ctx.font="bold 38px Arial";
ctx.fillText("عبسان الجديدة",600,1080);

ctx.fillStyle="#D32020";
ctx.font="28px Arial";
ctx.fillText("وفاء • انتماء • هوية",600,1120);

};

logo.src =
"https://raw.githubusercontent.com/aboodalda/abasan-certificate/main/FB_IMG_1780833976315.jpg";

}


window.downloadImage=function(){

const canvas=document.getElementById("canvas");

const link=document.createElement("a");

link.download="certificate.png";

link.href=canvas.toDataURL();

link.click();

};
window.shareCertificate = function(){

const text =
"أصدرت وثيقة الوفاء لبلدة عبسان الجديدة 🇵🇸\n\nسجل اسمك الآن:";

const url =
"https://aboodalda.github.io/abasan-certificate/";

window.open(
"https://wa.me/?text=" +
encodeURIComponent(text + "\n" + url)
);

};
async function loadRecent() {
  const q = query(collection(db, "certificates"), orderBy("number", "desc"), limit(6));
  const snap = await getDocs(q);
  const all = await getDocs(collection(db, "certificates"));
  document.getElementById("count").textContent = all.size;

  let pinnedHtml = "";
  let html = "";

  snap.forEach(doc => {
    const d = doc.data();
    const serial = "ABASAN-" + String(d.number).padStart(4, "0");
    if (d.pinned) {
      pinnedHtml = `
        <div class="recent-item" style="border:1px solid rgba(184,134,11,.3);border-radius:8px;padding:10px;margin-bottom:8px;background:rgba(184,134,11,.05);">
          <span class="badge" style="background:rgba(184,134,11,.3);">📌 ${serial}</span>
          <span style="color:var(--gold-light);font-weight:700;">${d.name}</span>
        </div>`;
    } else {
      html += `
        <div class="recent-item">
          <span class="badge">${serial}</span>
          <span>${d.name}</span>
        </div>`;
    }
  });

  if (!pinnedHtml && !html) {
    html = `<div class="recent-item" style="justify-content:center;color:rgba(255,255,255,.2);font-size:13px;">لا توجد وثائق بعد</div>`;
  }

  document.getElementById("recent-list").innerHTML = pinnedHtml + html;
}

loadRecent();

  

</script>

</body>
</html>
