<!DOCTYPE html>

<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وثيقة الوفاء لبلدة عبسان الجديدة</title>

<style>
body{
font-family:Tahoma,sans-serif;
background:#f5f5f5;
margin:0;
padding:0;
text-align:center;
}

header{
background:#0b6b3a;
color:white;
padding:30px;
}

.container{
max-width:900px;
margin:auto;
padding:20px;
}

.card{
background:white;
padding:20px;
border-radius:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

input{
width:90%;
padding:12px;
font-size:18px;
margin:10px 0;
}

button{
background:#0b6b3a;
color:white;
border:none;
padding:12px 25px;
font-size:18px;
cursor:pointer;
border-radius:8px;
}

canvas{
margin-top:20px;
max-width:100%;
background:white;
border:2px solid #0b6b3a;
}

.stats{
display:flex;
justify-content:center;
gap:20px;
margin-bottom:20px;
flex-wrap:wrap;
}

.stat{
background:#f2f2f2;
padding:15px;
border-radius:10px;
}

#people{
margin-top:30px;
text-align:right;
}

.person{
background:white;
padding:10px;
margin:8px 0;
border-radius:8px;
}
</style>

</head>

<body>

<header>
<h1>وثيقة الوفاء لبلدة عبسان الجديدة</h1>
<p>سجل اسمك وأصدر وثيقتك الرقمية</p>
</header>

<div class="container">

<div class="stats">
<div class="stat">📜 الشهادات: <span id="count">0</span></div>
</div>

<div class="card">

<input id="name" placeholder="اكتب اسمك الكامل">

<button onclick="generateCertificate()">
إصدار الوثيقة
</button>

<br><br>

<canvas id="canvas" width="1200" height="1200"></canvas>

<br><br>

<button onclick="downloadImage()">
تحميل الوثيقة
</button>

</div>

<div id="people"></div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
getDocs,
serverTimestamp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCdPq65Vz8tTn76k-XWwdK50ARyvDTLNbg",
authDomain: "abasan-certificate.firebaseapp.com",
projectId: "abasan-certificate",
storageBucket: "abasan-certificate.firebasestorage.app",
messagingSenderId: "156602443374",
appId: "1:156602443374:web:cb8369c7cf4b40c207a87f",
measurementId: "G-9SFYX4SCNC"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.generateCertificate = async function(){

const name=document.getElementById("name").value.trim();

if(!name){
alert("اكتب الاسم");
return;
}

const snapshot=await getDocs(collection(db,"certificates"));

const number=snapshot.size+1;

await addDoc(collection(db,"certificates"),{
name:name,
number:number,
createdAt:serverTimestamp()
});

document.getElementById("count").textContent=number;

drawCertificate(name,number);

loadPeople();
};

function drawCertificate(name,number){

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

ctx.fillStyle="#fff";
ctx.fillRect(0,0,1200,1200);

ctx.strokeStyle="#0b6b3a";
ctx.lineWidth=10;
ctx.strokeRect(30,30,1140,1140);

ctx.textAlign="center";

ctx.fillStyle="#0b6b3a";
ctx.font="bold 70px Arial";
ctx.fillText("وثيقة الوفاء لبلدة عبسان الجديدة",600,180);

ctx.fillStyle="#000";
ctx.font="bold 80px Arial";
ctx.fillText(name,600,500);

ctx.font="45px Arial";
ctx.fillText("تقديراً لانتمائه ووفائه لبلدة عبسان الجديدة",600,650);

ctx.fillText("رقم الوثيقة : "+number,600,760);
}

window.downloadImage=function(){

const canvas=document.getElementById("canvas");

const link=document.createElement("a");

link.download="certificate.png";

link.href=canvas.toDataURL();

link.click();

};

async function loadPeople(){

const snapshot=await getDocs(collection(db,"certificates"));

document.getElementById("count").textContent=snapshot.size;

let html="<h2>أصحاب الوثائق</h2>";

snapshot.forEach(doc=>{

const d=doc.data();

html+=`<div class="person">
${d.number} - ${d.name}
</div>`;

});

document.getElementById("people").innerHTML=html;

}

loadPeople();

</script>

</body>
</html>
